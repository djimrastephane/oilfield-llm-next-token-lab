name: Cross-platform notebooks

# Runs the README's Local setup steps on Windows, Linux and Intel macOS runners
# (CPU only, no GPU) and executes every notebook top to bottom. Heavy (real model inference on
# CPU), so it only runs on demand, or on PRs that change this workflow file.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cross-platform-notebooks.yml

env:
  HF_HOME: ${{ github.workspace }}/.hf-cache
  GENSIM_DATA_DIR: ${{ github.workspace }}/.gensim-data
  PYTHONUTF8: "0"  # keep the OS default text encoding, as a real user would have

jobs:
  setup-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README steps 2-4 (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          python -c "import torch, transformers, gensim; from transformers.utils import is_torch_available; print(torch.__version__, transformers.__version__, gensim.__version__, 'cuda' if torch.cuda.is_available() else 'cpu'); assert is_torch_available(), 'transformers cannot use this torch version'"
      - name: README step 3 (Command Prompt activation)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call .venv\Scripts\activate
          python -c "import sys; print(sys.prefix)"
      - name: README steps 2-4 (bash)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          python -c "import torch, transformers, gensim; from transformers.utils import is_torch_available; print(torch.__version__, transformers.__version__, gensim.__version__, 'cuda' if torch.cuda.is_available() else 'cpu'); assert is_torch_available(), 'transformers cannot use this torch version'"
      - name: Notebook structure check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv\Scripts\Activate.ps1
          python scripts/check_notebooks.py
      - name: Notebook structure check (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source .venv/bin/activate
          python scripts/check_notebooks.py

  execute:
    needs: setup-and-check
    # One OS failing setup shouldn't stop the others' notebooks from running.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-26-intel]
        notebook:
          - notebooks/01_how_a_real_llm_predicts_the_next_token.ipynb
          - notebooks/02_temperature_sampling_and_decoding_strategies.ipynb
          - notebooks/03_does_high_probability_mean_correct.ipynb
          - notebooks/04_grounding_answers_in_real_documents.ipynb
          - notebooks/05_day_to_day_rules_for_using_ai_tools.ipynb
          - advanced/01_embeddings_and_attention.ipynb
          - advanced/02_gradient_attribution_and_occlusion.ipynb
          - advanced/03_activation_patching_and_causal_tracing.ipynb
          - advanced/04_probing_classifiers.ipynb
          - advanced/05_individual_head_circuit_analysis.ipynb
          - advanced/06_individual_neuron_analysis.ipynb
          - advanced/07_grounding_answers_in_real_documents.ipynb
          - advanced/08_day_to_day_rules_for_using_ai_tools.ipynb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore model and GloVe cache
        uses: actions/cache@v4
        with:
          path: |
            .hf-cache
            .gensim-data
          key: ${{ runner.os }}-models-qwen2.5-1.5b-glove100-v1
      # nbclient's default 4-second wait for a cell's output is too short on slow
      # CPU runners: late output was silently dropped while the job still passed.
      # Wait longer, and fail if output is still missing.
      - name: Execute notebook (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\Activate.ps1
          pip install -r requirements.txt
          jupyter nbconvert --to notebook --execute "${{ matrix.notebook }}" --output-dir executed --ExecutePreprocessor.timeout=-1 --ExecutePreprocessor.iopub_timeout=60 --ExecutePreprocessor.raise_on_iopub_timeout=True
      - name: Execute notebook (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          jupyter nbconvert --to notebook --execute "${{ matrix.notebook }}" --output-dir executed --ExecutePreprocessor.timeout=-1 --ExecutePreprocessor.iopub_timeout=60 --ExecutePreprocessor.raise_on_iopub_timeout=True
      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ runner.os }}-${{ strategy.job-index }}
          path: executed/
          if-no-files-found: ignore
